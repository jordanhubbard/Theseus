name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libzstd-dev liblz4-dev libpcre2-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 pcre2 || true

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Install Node.js dependencies
        run: npm install

      - name: Validate Z-spec files
        run: make validate-zspecs

      - name: Run tests
        run: make test

      - name: Validate example records
        run: python3 tools/validate_record.py examples/ --quiet

      - name: Validate knowledge fabric
        run: make fabric-validate

      - name: Compile Z-specs for JSON verification
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: make compile-zsdl

      - name: Run verify-all-specs and write JSON results
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: make verify-all-specs-json OUT=verify-all-specs-results.json

      - name: Upload verify-all-specs JSON results
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-all-specs-results
          path: verify-all-specs-results.json

  freebsd:
    name: "FreeBSD 14.4 / Python 3.12"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run tests on FreeBSD
        uses: cross-platform-actions/action@492b0c80085400348c599edace11141a4ee73524
        with:
          operating_system: freebsd
          version: "14.4"
          image_url: https://github.com/cross-platform-actions/freebsd-builder/releases/download/v0.17.0/freebsd-14.4-x86-64.qcow2
          shell: bash
          run: |
            sudo pkg install -y \
              gmake \
              python312 py312-pip node22 npm-node22 py312-sqlite3 \
              py312-attrs py312-certifi py312-chardet py312-colorama \
              py312-decorator py312-filelock py312-idna \
              py312-more-itertools py312-packaging py312-platformdirs \
              py312-pluggy py312-pyparsing py312-pytz py312-six \
              py312-tomlkit py312-traitlets py312-typing-extensions \
              py312-tzdata py312-urllib3 py312-wrapt \
              py312-pygments py312-markupsafe py312-msgpack \
              py312-networkx py312-psutil py312-dnspython \
              py312-defusedxml py312-docutils \
              py312-numpy py312-lxml py312-pillow py312-pyyaml \
              py312-protobuf py312-tornado \
              zstd liblz4 pcre2
            PYTHON=$(command -v python3.12 2>/dev/null || command -v python3 2>/dev/null || command -v python 2>/dev/null)
            echo "Using Python: $PYTHON ($($PYTHON --version))"
            $PYTHON -m venv --system-site-packages .venv-ci
            PYTHON="$PWD/.venv-ci/bin/python"
            $PYTHON -m pip install --quiet -r requirements-ci.txt
            npm install
            # Use gmake (installed via pkg dependency above) rather than the
            # FreeBSD base 'make' — the Makefile uses GNU-make-only syntax
            # ($(if ...) conditionals) that BSD make does not understand.
            gmake validate-zspecs PYTHON=$PYTHON
            gmake test PYTHON=$PYTHON
            # Cross-OS spec verification — runs the curated smoke set
            # (libpcap from base, Python stdlib, npm pure-functions) on
            # FreeBSD specifically. This is the strongest evidence that
            # ZSDL invariants hold across a third UNIX target.
            gmake freebsd-smoke PYTHON=$PYTHON
