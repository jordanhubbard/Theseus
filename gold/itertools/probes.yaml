family: itertools
backend: python_module
module: itertools
probes:
- id: first_element_chain
  function: chain
  args:
  - - 10
    - 20
  - - 30
  method: __next__
  expect:
    eq: 10
- id: first_element_islice
  function: islice
  args:
  - - 5
    - 6
    - 7
    - 8
  - 2
  method: __next__
  expect:
    eq: 5
