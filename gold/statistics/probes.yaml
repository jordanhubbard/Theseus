family: statistics
backend: python_module
module: statistics
probes:
- id: mean_ints
  function: mean
  args: [[1, 2, 3, 4, 5]]
  expect: {eq: 3}
- id: geo
  function: geometric_mean
  args: [[1, 2, 4]]
  expect: {eq: 2.0}
- id: empty_mean
  function: mean
  args: [[]]
  expect: {raises: StatisticsError}
