family: getopt
backend: python_module
module: getopt
probes:
- id: getopt_simple_short_opts
  function: getopt
  args:
  - - -a
  - a
  method: __getitem__
  method_args:
  - 0
  expect:
    eq:
    - - -a
      - ''
- id: getopt_multiple_short_opts
  function: getopt
  args:
  - - -a
    - -b
    - foo
  - ab
  method: __getitem__
  method_args:
  - 0
  expect:
    eq:
    - - -a
      - ''
    - - -b
      - ''
