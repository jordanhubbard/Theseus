family: abc_meta
backend: python_module
module: abc
probes:
- id: ABC_abstractmethods_empty
  function: ABC.__abstractmethods__.__len__
  args: []
  expect:
    eq: 0
- id: update_abstractmethods_name
  function: update_abstractmethods.__name__.__eq__
  args:
  - update_abstractmethods
  expect:
    eq: true
