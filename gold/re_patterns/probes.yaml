family: re_patterns
backend: python_module
module: re
probes:
- id: match_no_anchor_fails
  function: match
  args:
  - \d+
  - abc123
  method: __eq__
  method_args:
  - null
  expect:
    eq: true
- id: fullmatch_partial_match_is_none
  function: fullmatch
  args:
  - \d{3}
  - '1234'
  method: __eq__
  method_args:
  - null
  expect:
    eq: true
