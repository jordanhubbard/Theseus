family: decimal
backend: python_module
module: decimal
probes:
- id: str_one_point_five
  function: Decimal
  args: ["1.5"]
  method: __str__
  expect: {eq: "1.5"}
- id: trailing_zeros
  function: Decimal
  args: ["1.00"]
  method: __str__
  expect: {eq: "1.00"}
- id: default_prec
  function: getcontext
  method: prec
  expect: {eq: 28}
