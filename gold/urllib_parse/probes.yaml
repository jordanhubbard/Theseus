family: urllib_parse
backend: python_module
module: urllib.parse
probes:
- id: scheme
  function: urlparse
  args:
  - https://example.com:8080/path?q=1#frag
  method: scheme
  expect:
    eq: https
- id: rfc_host
  function: urlparse
  args:
  - http://www.ics.uci.edu/pub/ietf/uri/#Related
  method: netloc
  expect:
    eq: www.ics.uci.edu
