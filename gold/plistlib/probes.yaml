family: plistlib
backend: python_module
module: plistlib
probes:
- id: plistlib_dumps_returns_bytes
  function: dumps
  args:
  - key: value
  method: __class__.__name__.__eq__
  method_args:
  - bytes
  expect:
    eq: true
- id: plistlib_dumps_integer_returns_bytes
  function: dumps
  args:
  - 42
  method: __class__.__name__.__eq__
  method_args:
  - bytes
  expect:
    eq: true
