family: itertools_product
backend: python_module
module: itertools
probes:
- id: product_first_pair
  function: product
  args:
  - - 1
    - 2
  - - 3
    - 4
  method: __next__
  expect:
    eq:
    - 1
    - 3
- id: product_single_list_first
  function: product
  args:
  - - 10
    - 20
    - 30
  method: __next__
  expect:
    eq:
    - 10
