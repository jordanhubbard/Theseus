family: logging_config
backend: python_module
module: logging.config
probes:
- id: logging_config_dictconfigurator_mro
  function: DictConfigurator.__mro__.__getitem__
  args:
  - 1
  method: __name__
  expect:
    eq: BaseConfigurator
- id: fname_dictconfig
  function: dictConfig.__name__.__eq__
  args:
  - dictConfig
  expect:
    eq: true
