family: pathspec
backend: python_module
module: pathspec
probes:
- id: match_py
  function: PathSpec.from_lines
  args: ["gitwildmatch", ["*.py"]]
  method: match_file
  method_args: ["hello.py"]
  expect: {eq: true}
- id: no_match_txt
  function: PathSpec.from_lines
  args: ["gitwildmatch", ["*.py"]]
  method: match_file
  method_args: ["hello.txt"]
  expect: {eq: false}
