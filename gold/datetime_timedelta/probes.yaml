family: datetime_timedelta
backend: python_module
module: datetime
probes:
- id: datetime_timedelta_weeks_to_days
  function: timedelta
  args: []
  kwargs:
    weeks: 1
  method: days
  expect:
    eq: 7
- id: datetime_timedelta_hours_to_seconds
  function: timedelta
  args: []
  kwargs:
    hours: 1
  method: seconds
  expect:
    eq: 3600
