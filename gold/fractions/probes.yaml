family: fractions
backend: python_module
module: fractions
probes:
- id: reduce
  function: Fraction
  args: [2, 4]
  method: __str__
  expect: {eq: "1/2"}
- id: from_string
  function: Fraction
  args: ["3/4"]
  method: __str__
  expect: {eq: "3/4"}
- id: zero_denom
  function: Fraction
  args: [1, 0]
  expect: {raises: ZeroDivisionError}
