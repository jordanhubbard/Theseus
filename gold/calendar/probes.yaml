family: calendar
backend: python_module
module: calendar
probes:
- id: isleap_2000
  function: isleap
  args: [2000]
  expect: {eq: true}
- id: isleap_1900
  function: isleap
  args: [1900]
  expect: {eq: false}
- id: monthrange_feb2024
  function: monthrange
  args: [2024, 2]
  expect:
    eq: {type: tuple, value: [3, 29]}
