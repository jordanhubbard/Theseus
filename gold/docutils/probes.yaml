family: docutils
backend: python_module
module: docutils
probes:
- id: version_contains_dot
  function: __version__.__contains__
  args:
  - .
  expect:
    eq: true
- id: version_major_ge_0
  function: __version_info__.__getitem__
  args:
  - 0
  method: __ge__
  method_args:
  - 0
  expect:
    eq: true
