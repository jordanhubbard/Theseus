family: locale
backend: python_module
module: locale
probes:
- id: getpreferredencoding_returns_str
  function: getpreferredencoding
  args:
  - false
  method: __class__.__name__
  expect:
    eq: str
- id: LC_ALL_is_int
  function: LC_ALL.__class__.__name__.__eq__
  args:
  - int
  expect:
    eq: true
