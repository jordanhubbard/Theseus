family: posixpath
backend: python_module
module: posixpath
probes:
- id: join_two
  function: join
  args: ["foo", "bar"]
  expect: {eq: "foo/bar"}
- id: split_foo_bar
  function: split
  args: ["/foo/bar"]
  expect:
    eq: {type: tuple, value: ["/foo", "bar"]}
- id: isabs
  function: isabs
  args: ["/tmp"]
  expect: {eq: true}
