family: email_mime
backend: python_module
module: email.mime.text
probes:
- id: hierarchy_MIMEText_base
  function: MIMEText.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: MIMENonMultipart
- id: content_type_plain
  function: MIMEText
  args:
  - hello
  - plain
  method: get_content_type
  expect:
    eq: text/plain
