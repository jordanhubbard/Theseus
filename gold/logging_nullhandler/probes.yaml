family: logging_nullhandler
backend: python_module
module: logging
probes:
- id: logging_nullhandler_nullhandler_base
  function: NullHandler.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: Handler
- id: logging_nullhandler_handler_base
  function: Handler.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: Filterer
