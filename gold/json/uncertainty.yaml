status: accepted
items:
  - id: json.duplicate_keys
    claim: "RFC 8259 allows implementations to use the last value for duplicate object keys."
    status: deferred
    evidence: "RFC 8259 §4"
    resolution: "Out of scope. Do not infer last-wins from CPython."
  - id: json.nan_infinity
    claim: "NaN and Infinity are not JSON. Python accepts them only when allow_nan=True."
    status: resolved
    evidence: "RFC 8259 §6; live probe loads('nan') raises JSONDecodeError"
  - id: json.bytes_input
    claim: "stdlib loads() accepts UTF-8 bytes; this gold set grades str only."
    status: deferred
    evidence: "docs.python.org/3/library/json.html"
  - id: json.held_out_vectors
    claim: "Trailing commas, BMP ensure_ascii, scientific 1.5e2 stay in gold/json/held_out.zspec.zsdl."
    status: held_out
    evidence: "ADR 0002"
