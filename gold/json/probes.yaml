family: json
backend: python_module
module: json
probes:
  - id: dumps_integer
    function: dumps
    args: [42]
    expect: {eq: "42"}
  - id: dumps_compact
    function: dumps
    args: [[1, 2, 3]]
    kwargs:
      separators: {type: tuple, value: [",", ":"]}
    expect: {eq: "[1,2,3]"}
  - id: loads_null
    function: loads
    args: ["null"]
    expect: {eq: null}
  - id: loads_nan_raises
    function: loads
    args: ["nan"]
    expect: {raises: JSONDecodeError}
  - id: dumps_empty_string
    function: dumps
    args: [""]
    expect: {eq: "\"\""}
  - id: loads_whitespace_true
    function: loads
    args: [" true "]
    expect: {eq: true}
