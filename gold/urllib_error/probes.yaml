family: urllib_error
backend: python_module
module: urllib.error
probes:
- id: urllib_error_urlerror_reason
  function: URLError
  args:
  - connection refused
  method: reason
  expect:
    eq: connection refused
- id: urllib_error_urlerror_reason_test
  function: URLError
  args:
  - test reason
  method: reason
  expect:
    eq: test reason
