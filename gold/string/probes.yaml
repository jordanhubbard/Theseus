family: string
backend: python_module
module: string
probes:
- id: digits_len
  function: digits.__len__
  args: []
  expect: {eq: 10}
- id: capwords
  function: capwords
  args: ["hello world"]
  expect: {eq: "Hello World"}
- id: punct_dot
  function: punctuation.__contains__
  args: ["."]
  expect: {eq: true}
