family: urllib_request
backend: python_module
module: urllib.request
probes:
- id: urllib_request_req_type
  function: Request
  args:
  - http://example.com
  method: type
  expect:
    eq: http
- id: urllib_request_req_host
  function: Request
  args:
  - http://example.com
  method: host
  expect:
    eq: example.com
