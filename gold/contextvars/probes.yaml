family: contextvars
backend: python_module
module: contextvars
probes:
- id: contextvar_get_default_str
  function: ContextVar
  args:
  - x
  method: get
  method_args:
  - default
  expect:
    eq: default
- id: copy_context_returns_context
  function: copy_context
  args: []
  method: __class__.__name__
  expect:
    eq: Context
