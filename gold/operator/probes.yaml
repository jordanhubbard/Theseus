family: operator
backend: python_module
module: operator
probes:
- id: add
  function: add
  args: [3, 4]
  expect: {eq: 7}
- id: itemgetter_b
  function: itemgetter
  args: [1]
  method: __call__
  method_args: ["ABCDEFG"]
  expect: {eq: "B"}
- id: contains
  function: contains
  args: [[1, 2, 3], 2]
  expect: {eq: true}
