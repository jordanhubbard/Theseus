family: xml_parse
backend: python_module
module: xml.etree.ElementTree
probes:
- id: xml_parse_ParseError_base
  function: ParseError.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: SyntaxError
- id: xml_parse_ParseError_is_exception_subclass
  function: ParseError.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: SyntaxError
