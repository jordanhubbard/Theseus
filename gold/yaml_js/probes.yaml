family: yaml_js
backend: node
module: yaml
probes:
- id: yamlp_simple
  function: parse
  args:
  - 'name: Alice

    age: 30'
  expect:
    eq:
      name: Alice
      age: 30
- id: yamlp_list
  function: parse
  args:
  - "items:\n  - 1\n  - 2\n  - 3"
  expect:
    eq:
      items:
      - 1
      - 2
      - 3
