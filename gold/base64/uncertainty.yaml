items:
  - id: base64.newline
    claim: "b64encode may append a newline in some wrappers; stdlib b64encode does not."
    status: resolved
    evidence: "RFC 4648 §3.1; live probe of b64encode(b'foo')"
  - id: base64.validate
    claim: "Invalid alphabet is ignored unless validate=True."
    status: resolved
    evidence: "Python docs; live probe b64decode('not!valid@base64#data', validate=True) raises"
  - id: base64.padding
    claim: "Missing padding behaviour is an implementation choice; RFC prefers padding."
    status: deferred
    evidence: "RFC 4648 §3.2"
