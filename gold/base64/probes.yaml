family: base64
backend: python_module
module: base64
probes:
- id: enc_foo
  function: b64encode
  args:
  - type: bytes_ascii
    value: foo
  expect:
    eq:
      type: bytes_ascii
      value: Zm9v
- id: dec_foo
  function: b64decode
  args:
  - Zm9v
  expect:
    eq:
      type: bytes_ascii
      value: foo
