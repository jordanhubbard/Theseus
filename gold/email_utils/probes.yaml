family: email_utils
backend: python_module
module: email.utils
probes:
- id: email_utils_parseaddr_display
  function: parseaddr
  args:
  - John Doe <john@example.com>
  method: __getitem__
  method_args:
  - 0
  expect:
    eq: John Doe
- id: email_utils_parseaddr_email
  function: parseaddr
  args:
  - John Doe <john@example.com>
  method: __getitem__
  method_args:
  - 1
  expect:
    eq: john@example.com
