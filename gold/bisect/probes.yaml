family: bisect
backend: python_module
module: bisect
probes:
- id: left_present
  function: bisect_left
  args: [[1, 3, 5, 7, 9], 5]
  expect: {eq: 2}
- id: right_present
  function: bisect_right
  args: [[1, 3, 5, 7, 9], 5]
  expect: {eq: 3}
- id: empty
  function: bisect_left
  args: [[], 5]
  expect: {eq: 0}
