family: argparse_formatters
backend: python_module
module: argparse
probes:
- id: fbase_rawdescription_base
  function: RawDescriptionHelpFormatter.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: HelpFormatter
- id: fbase_rawtext_base
  function: RawTextHelpFormatter.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: RawDescriptionHelpFormatter
