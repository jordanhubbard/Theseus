family: xml_dom
backend: python_module
module: xml.dom.minidom
probes:
- id: xml_dom_parse_tagname
  function: parseString
  args:
  - <root/>
  method: documentElement.tagName
  expect:
    eq: root
- id: xml_dom_parse_nodename
  function: parseString
  args:
  - <root/>
  method: documentElement.nodeName
  expect:
    eq: root
