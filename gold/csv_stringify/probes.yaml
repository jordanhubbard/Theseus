family: csv_stringify
backend: node
module: csv-stringify/sync
probes:
- id: arr_two_rows
  function: stringify
  args:
  - - - a
      - b
    - - '1'
      - '2'
  expect:
    eq: 'a,b

      1,2

      '
- id: arr_single_row
  function: stringify
  args:
  - - - x
      - y
      - z
  expect:
    eq: 'x,y,z

      '
