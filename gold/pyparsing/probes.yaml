family: pyparsing
backend: python_module
module: pyparsing
probes:
- id: common_integer
  function: pyparsing_common.integer.parse_string
  args:
  - '42'
  method: as_list
  expect:
    eq:
    - 42
- id: common_signed_integer
  function: pyparsing_common.signed_integer.parse_string
  args:
  - '-5'
  method: as_list
  expect:
    eq:
    - -5
