family: quopri
backend: python_module
module: quopri
probes:
- id: decode_equals
  function: decodestring
  args: [{type: bytes_ascii, value: "=3D"}]
  expect:
    eq: {type: bytes_ascii, value: "="}
- id: encode_hello
  function: encodestring
  args: [{type: bytes_ascii, value: "hello"}]
  expect:
    eq: {type: bytes_ascii, value: "hello"}
