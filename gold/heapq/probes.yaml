family: heapq
backend: python_module
module: heapq
probes:
- id: nlargest_top2
  function: nlargest
  args: [2, [1, 8, 2, 6, 3]]
  expect: {eq: [8, 6]}
- id: nsmallest_top2
  function: nsmallest
  args: [2, [1, 8, 2, 6, 3]]
  expect: {eq: [1, 2]}
- id: nlargest_empty
  function: nlargest
  args: [2, []]
  expect: {eq: []}
