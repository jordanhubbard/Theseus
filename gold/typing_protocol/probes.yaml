family: typing_protocol
backend: python_module
module: typing
probes:
- id: supports_name_SupportsRound
  function: SupportsRound.__name__.__eq__
  args:
  - SupportsRound
  expect:
    eq: true
- id: supports_module_SupportsRound
  function: SupportsRound.__module__.__eq__
  args:
  - typing
  expect:
    eq: true
