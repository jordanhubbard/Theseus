family: markdown_it
backend: node
module: markdown-it
probes:
- id: render_h1_header
  function: '~'
  args: []
  method: render
  method_args:
  - '# Hi'
  expect:
    eq: '<h1>Hi</h1>

      '
- id: render_bold
  function: '~'
  args: []
  method: render
  method_args:
  - '**bold**'
  expect:
    eq: '<p><strong>bold</strong></p>

      '
