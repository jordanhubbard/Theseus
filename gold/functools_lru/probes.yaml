family: functools_lru
backend: python_module
module: functools
probes:
- id: lru_cache_decorator_is_callable
  function: lru_cache
  args:
  - 128
  method: __class__.__name__
  expect:
    eq: function
- id: lru_cache_result_is_not_none
  function: lru_cache
  args:
  - 128
  method: __class__.__name__
  expect:
    eq: function
