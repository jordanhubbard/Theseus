family: htmlparser2
backend: node
module: htmlparser2
probes:
- id: htmlparser2_parse_document_one_top_child
  function: parseDocument
  args:
  - <p>hi</p>
  method: children.length
  expect:
    eq: 1
- id: htmlparser2_two_top_children
  function: parseDocument
  args:
  - <p>1</p><p>2</p>
  method: children.length
  expect:
    eq: 2
