family: ipaddress
backend: python_module
module: ipaddress
probes:
- id: ipv4_str
  function: IPv4Address
  args: ["192.168.1.1"]
  method: __str__
  expect: {eq: "192.168.1.1"}
- id: ipv4_private
  function: IPv4Address
  args: ["10.0.0.1"]
  method: is_private
  expect: {eq: true}
- id: packed_loopback
  function: IPv4Address
  args: ["127.0.0.1"]
  method: packed
  expect:
    eq: {type: bytes_hex, value: "7f000001"}
