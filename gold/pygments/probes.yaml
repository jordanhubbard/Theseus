family: pygments
backend: python_module
module: pygments
probes:
- id: styles_default_name
  function: styles.get_style_by_name
  args:
  - default
  method: __name__
  expect:
    eq: DefaultStyle
- id: styles_default_background
  function: styles.get_style_by_name
  args:
  - default
  method: background_color
  expect:
    eq: '#f8f8f8'
