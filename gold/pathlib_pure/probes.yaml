family: pathlib_pure
backend: python_module
module: pathlib
probes:
- id: pathlib_pure_PurePosixPath_base
  function: PurePosixPath.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: PurePath
- id: pathlib_pure_PureWindowsPath_base
  function: PureWindowsPath.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: PurePath
