family: datetime
backend: python_module
module: datetime
probes:
- id: date_isoformat
  function: date.fromisoformat
  args:
  - '2024-03-15'
  method: isoformat
  expect:
    eq: '2024-03-15'
- id: date_strftime
  function: date.fromisoformat
  args:
  - '2024-03-15'
  method: strftime
  method_args:
  - '%Y/%m/%d'
  expect:
    eq: 2024/03/15
