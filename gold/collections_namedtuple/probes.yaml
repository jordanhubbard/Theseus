family: collections_namedtuple
backend: python_module
module: collections
probes:
- id: collections_namedtuple_fields
  function: namedtuple
  args:
  - Point
  - - x
    - y
  method: _fields
  expect:
    eq:
      type: tuple
      value:
      - x
      - y
- id: collections_namedtuple_field_count_three
  function: namedtuple
  args:
  - RGB
  - - r
    - g
    - b
  method: _fields.__len__
  expect:
    eq: 3
