family: http_server_handlers
backend: python_module
module: http.server
probes:
- id: http_server_handlers_simple_base
  function: SimpleHTTPRequestHandler.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: BaseHTTPRequestHandler
- id: http_server_handlers_cgi_base
  function: CGIHTTPRequestHandler.__bases__.__getitem__
  args:
  - 0
  method: __name__
  expect:
    eq: SimpleHTTPRequestHandler
