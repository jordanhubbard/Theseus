family: pprint
backend: python_module
module: pprint
probes:
- id: pformat_int
  function: pformat
  args: [42]
  expect: {eq: "42"}
- id: pformat_list
  function: pformat
  args: [[1, 2, 3]]
  expect: {eq: "[1, 2, 3]"}
- id: sort_dicts
  function: pformat
  args:
  - {b: 1, a: 2}
  kwargs: {sort_dicts: true}
  expect: {eq: "{'a': 2, 'b': 1}"}
