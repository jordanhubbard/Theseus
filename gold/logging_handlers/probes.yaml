family: logging_handlers
backend: python_module
module: logging.handlers
probes:
- id: logging_handlers_memoryhandler_capacity
  function: MemoryHandler
  args:
  - 10
  method: capacity
  expect:
    eq: 10
- id: cname_baserotating
  function: BaseRotatingHandler.__name__.__eq__
  args:
  - BaseRotatingHandler
  expect:
    eq: true
