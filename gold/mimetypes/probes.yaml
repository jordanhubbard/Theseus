family: mimetypes
backend: python_module
module: mimetypes
probes:
- id: gt_html
  function: guess_type
  args:
  - file.html
  method: __getitem__
  method_args:
  - 0
  expect:
    eq: text/html
- id: gt_txt
  function: guess_type
  args:
  - file.txt
  method: __getitem__
  method_args:
  - 0
  expect:
    eq: text/plain
