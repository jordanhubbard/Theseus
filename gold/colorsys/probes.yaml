family: colorsys
backend: python_module
module: colorsys
probes:
- id: hsv_red_hue
  function: rgb_to_hsv
  args: [1.0, 0.0, 0.0]
  method: __getitem__
  method_args: [0]
  expect: {eq: 0.0}
- id: hsv_to_rgb_red
  function: hsv_to_rgb
  args: [0.0, 1.0, 1.0]
  method: __getitem__
  method_args: [0]
  expect: {eq: 1.0}
