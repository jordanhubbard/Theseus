family: keyword
backend: python_module
module: keyword
probes:
- id: iskeyword_for
  function: iskeyword
  args: ["for"]
  expect: {eq: true}
- id: iskeyword_print
  function: iskeyword
  args: ["print"]
  expect: {eq: false}
- id: kwlist_for
  function: kwlist.__contains__
  args: ["for"]
  expect: {eq: true}
