family: markdown_table
backend: node
module: markdown-table
probes:
- id: tbl_two_columns_two_rows
  function: markdownTable
  args:
  - - - a
      - b
    - - '1'
      - '2'
  expect:
    eq: '| a | b |

      | - | - |

      | 1 | 2 |'
- id: tbl_name_age_aligned
  function: markdownTable
  args:
  - - - Name
      - Age
    - - Alice
      - '30'
    - - Bob
      - '25'
  expect:
    eq: '| Name  | Age |

      | ----- | --- |

      | Alice | 30  |

      | Bob   | 25  |'
